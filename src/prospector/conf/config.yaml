seed: 42

# How to drive the main simulation?
simulation:
  # dynamics model to use: dynamics_2d_linear | dynamics_3d_linear | dynamics_3d
  dynamics_model: dynamics_3d_linear
  # cave to explore: chamber | tunnels | grapevine
  cave: tunnels
  agents:
    num_agents: 3
    policy: policy_random
  render:
    # If true, produce an image for every step of the simulation
    # and render it in a window, then compile into a video at the end.
    # This slows down the simulation.
    enabled: true
    # Making this < 1 will speed up rendering at the cost of 
    # quality/layout niceness
    figure_size_multiplier: 1.0

# ----------------------------------------------------------------
# Relating to the loading, processing, and plotting of the cave data
# ----------------------------------------------------------------
caves:

  chamber:
    source: DARPA SubT Challenge Final Event
    metadata: 
     - key: DARPA SubT Section Number
       value: 5
    relative_path: "/src/assets/chamber.ply"
    known_internal_xyz: [59.301, 105.96, 0.136567]
    slice_for_2d:
      z: -3.1
      thickness: 0.1
    voxel_size: 0.1
    plotting:
      obstacle_points:
        max_num: 20000
        alpha: 0.1

  tunnels:
    source: DARPA SubT Challenge Final Event
    metadata: 
      - key: DARPA SubT Section Number
        value: 6
    relative_path: "/src/assets/tunnels.ply"
    known_internal_xyz: [29.1537, 39.3087, -2.45432]
    slice_for_2d:
      z: -2.25432
      thickness: 0.1
    voxel_size: 0.1
    plotting:
      obstacle_points:
        max_num: 10000
        alpha: 0.1

  grapevine:
    source: Stanford Expedition
    metadata: 
      - key: Expedition date
        value: 24 May 2025
      - key: Survey team
        value:
          - Isaac R. Ward
          - Michelle Ho
          - Maximilian Adang
    relative_path: "/src/assets/grapevine.ply"
    known_internal_xyz: [11.5246, 23.8243, -1.52496]
    slice_for_2d:
      z: null
      thickness: 0.1
    voxel_size: 0.05
    plotting:
      obstacle_points:
        max_num: 20000
        alpha: 0.1

# ----------------------------------------------------------------
# Relating to agents
# ----------------------------------------------------------------
agents:

  agent_radius: 0.1
  history_length: 16

# ----------------------------------------------------------------
# Relating to the environment / simulation settings
# ----------------------------------------------------------------
environment:

  max_episode_length: 1000

# ----------------------------------------------------------------
# Relating to the underlying physical dynamics models
# ----------------------------------------------------------------
dynamics:

  dynamics_2d_linear:
    dt: 0.1
    # State is [x, y]
    state_dim: 2
    state_limits:
      - [null, null]
      - [null, null]
    # Action is [ux, uy]
    action_dim: 2
    action_limits:
      - [-2, 2]
      - [-2, 2]  
    position_dimensions: [0, 1]

  dynamics_3d_linear:
    dt: 0.1
    # State is [x, y, z]
    state_dim: 3
    state_limits:
      - [null, null]
      - [null, null]
      - [null, null]
    # Action is [ux, uy, uz]
    action_dim: 3
    action_limits:
      - [-2, 2]
      - [-2, 2]
      - [-2, 2]
    position_dimensions: [0, 1, 2]

  dynamics_3d:
    dt: 0.1
    # State is
    # [x, y, z, 
    # vx, vy, vz, 
    # roll, pitch, yaw, 
    # p, q, r]
    state_dim: 12
    state_limits:
      - [null, null]
      - [null, null]
      - [null, null]
      - [null, null]
      - [null, null]
      - [null, null]
      - [null, null]
      - [null, null]
    # Action is [w_rotor_1, w_rotor_2, w_rotor_3, w_rotor_4]
    action_dim: 4
    action_limits:
      - [-0.5, 0.5]
      - [-0.5, 0.5]
      - [-0.5, 0.5]
      - [-0.5, 0.5]
    position_dimensions: [0, 1, 2]