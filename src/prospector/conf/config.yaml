seed: 44

# How to drive the main simulation?
simulation:
  # dynamics model to use: dynamics_2d_linear | dynamics_3d_linear | dynamics_3d
  dynamics_model: dynamics_3d
  # cave to explore: chamber | tunnels | combined | grapevine-exped-3
  # (grapevine-exped-2 is archived; grapevine-exped-3 is the active grapevine survey)
  cave: tunnels
  agents:
    num_agents: 2
    # policy to use: policy_random | policy_mppi
    policy: policy_mppi
  render:
    # If true, produce an image for every step of the simulation
    # and render it in a window, then compile into a video at the end.
    # This slows down the simulation.
    enabled: true
    # Making this < 1 will speed up rendering at the cost of 
    # quality/layout niceness
    figure_size_multiplier: 1.0
    # If true, the video plays in real time at `fps`, interpolating frames
    # between control steps (fps * dt must be an integer); else one frame per
    # step at `fps`
    realtime: true
    fps: 30
  post_processing:
    # EXAMPLE VALUE -- set to your own run: the log folder (under logs/ or
    # saved/, or an absolute path) whose blender_renders/ should be turned into
    # videos by test_blender_outputs_to_video
    render_blender_outputs_folder: "run_2026_01_17_17_29_12_test_simulation"
  # How many waypoints to task each agent with reaching?
  num_waypoints: 8
  # You can also provide your own waypoints manually, but they 
  # must be per agent, and they need to be with reference
  # to a cave's graph coordinate system, not world coordinates. Examples are attached to the cave configs 
  # below
  use_provided_graph_waypoints: true 

  # After reaching all waypoints, how many seconds to continue simulating
  seconds_to_simulate_after_completion: 2.0

# ----------------------------------------------------------------
# Benchmarking high-level tours with the low-level controller
# (python -m prospector.benchmarks.benchmark_tours)
# ----------------------------------------------------------------
benchmark:
  # Step-aligned multi-agent tours over graph nodes (0-based node indices)
  # (see src/assets/tours/example_tours.json for the format)
  tours_file: "src/assets/tours/example_tours.json"
  # Which tour instances to run (keys of `instances` below)
  # The example tours file only has tunnel_3d_025; add others for your own tours
  run_instances: [tunnel_3d_025]
  instances:
    tunnel_3d_025:
      cave: tunnels
      graph_file: "src/assets/graphs/n=25/tunnels_3d.json"
    chamber_3d_025:
      cave: chamber
      graph_file: "src/assets/graphs/n=25/chamber_3d.json"
    grapevine_3d_025:
      cave: grapevine-exped-3
      graph_file: "src/assets/graphs/n=25/grapevine-exped-3_3d.json"
  num_trials: 10
  # Parallel worker processes (1 = sequential)
  num_workers: 6
  # If true, at every tour step flagged 'contact' both agents hold at their
  # node until all agents have arrived AND have line of sight, then continue.
  wait_for_comms: true
  # Hard cap on simulation steps per trial
  max_steps: 8000
  # After success, keep simulating this long (agents hold at their final
  # nodes) so videos / Blender renders don't cut off mid-arrival. Metrics are
  # taken at the completion step.
  hold_after_completion_s: 2.0
  # Fail if any agent waits at a rendezvous longer than this many steps
  rendezvous_timeout_steps: 3000
  # Fail if no agent reaches a new waypoint for this many steps
  stall_timeout_steps: 1000
  # Which trial indices (per instance) record a matplotlib video
  video_trials: [0]
  render_every_n_steps: 1
  # Videos play in real time at this fps; frames between control steps are
  # interpolated (video_fps * dt * render_every_n_steps must be an integer)
  video_fps: 30
  # Overlay graph nodes (with index labels) and edges in rendered frames
  render_graph: false

# ----------------------------------------------------------------
# Settings for using background blender
# ----------------------------------------------------------------
blender:
  # Blender executable: a full path, or a name found on PATH. Use Blender 5.0+:
  # cave-maps.blend was saved with 5.0 (older versions load it very slowly and
  # can evaluate the cut-away cave meshes wrongly).
  blender_executable_path: "blender"
  relative_to_repo_blend_file_path: "src/assets/blender/cave-maps.blend"
  # EXAMPLE VALUE -- set to your own run: the log folder to render (relative to
  # logs/ or saved/, or an absolute path), e.g. a benchmark trial folder like
  # run_<timestamp>_benchmark_tours/tunnel_3d_025/trial_00
  log_folder_to_process: "run_2026_01_17_17_29_08_test_simulation"
  # Must be true to actually render headlessly
  render: true
  # If set to a number, will only render this many frames from the start, 
  # If set to null, will render all frames
  render_first_n_frames: null
  # If true, will skip rendering frames that already have images rendered
  skip_existing_renders: false
  # Cameras to render: any of [overhead, pov, top_down]; null = all
  views: null
  # If true, render only the final frame (e.g. the completed-path figure)
  render_last_frame_only: false
  # Real-time playback: each sim step spans video_fps * dt frames (must be an
  # integer, e.g. 10/20/30/60 at dt = 0.1), with Blender interpolating between
  # keyframes. Render cost scales with it. null = one frame per sim step.
  video_fps: 30

# ----------------------------------------------------------------
# Relating to the environment / simulation settings
# ----------------------------------------------------------------
environment:

  max_episode_length: 4096

# ----------------------------------------------------------------
# Relating to rewards
# ----------------------------------------------------------------
rewards:

  waypoint_following:
    distance_weight: 1.0
    control_effort_weight: 0.1
    collision_penalty: 1e6
    # If this is higher, then the agent can be within this number
    # * their agent_radius of the goal to consider it reached
    multiplier_within_radius_of_goal: 3.0

# ----------------------------------------------------------------
# Relating to policies
# ----------------------------------------------------------------
policies:

  policy_mppi:
    # Base settings, overridden per dynamics model below. Shared by
    # test_simulation and the tour benchmark (agents/policies/mppi_factory.py).
    num_samples: 256
    horizon: 20
    # Lambda range is (0, inf)
    # If lambda is small, this approaches picking the max-reward action
    # If lambda is large, this approaches uniform weighting
    lambda_: 0.2
    noise_std: 0.5
    sampling_mode: "gaussian"  # uniform | gaussian
    # If the executed (sample-averaged) plan's rollout collides, execute the
    # best sample instead
    safe_fallback: true
    # Optional soft safety margin in the cost: planned states within
    # margin_radius of rock (but outside agents.agent_radius, the crash check)
    # pay margin_penalty, except within margin_exempt_radius of the target.
    # Off: the fallback alone avoids collisions, and on coarse maps (grapevine,
    # 0.2 m voxels) a 0.15 m margin stalls agents in narrow shafts.
    margin_radius: null
    margin_penalty: 1000.0
    margin_exempt_radius: 1.0
    per_dynamics:
      # Full 12D model in velocity mode: standard warm-started MPPI
      dynamics_3d:
        warm_start: true
        noise_smoothing: 0.5
        include_nominal_sample: true
        reward_normalization: "median"
      # Simple kinematic model (not used for results)
      dynamics_3d_linear:
        num_samples: 32
        horizon: 10
        lambda_: 1.0
        noise_std: 0.05
        sampling_mode: "uniform"

# ----------------------------------------------------------------
# Relating to agents
# ----------------------------------------------------------------
agents:

  agent_radius: 0.1
  history_length: 16

# ----------------------------------------------------------------
# Relating to the loading, processing, and plotting of the cave data
# ----------------------------------------------------------------
caves:

  chamber:
    source: DARPA SubT Challenge Final Event
    metadata: 
     - key: DARPA SubT Section Number
       value: 5
    relative_path: "/src/assets/point_clouds/chamber.ply"
    known_internal_xyz: [59.301, 105.96, 0.136567]
    slice_for_2d:
      z: -3.1
      thickness: 0.1
    voxel_size: 0.1
    plotting:
      obstacle_points:
        max_num: 20000
        alpha: 0.1

    # This file relates the graph waypoints to world coordinates.
    graph_waypoints_file: "src/assets/graphs/n=15/chamber_3d.json"

    # From the paper, we provide these example waypoints
    # for a 2-agent system to explore the 3d chamber
    graph_waypoints:
      [
        # Agent 1
        [0, 5, 10, 4, 1, 3, 6, 13, 14, 13, 6, 5],
        # Agent 2
        [0, 11, 7, 11, 0, 12, 8, 12, 2, 9, 1, 0]
      ]

  tunnels:
    source: DARPA SubT Challenge Final Event
    metadata: 
      - key: DARPA SubT Section Number
        value: 6
    relative_path: "/src/assets/point_clouds/tunnels.ply"
    known_internal_xyz: [29.1537, 39.3087, -2.45432]
    slice_for_2d:
      z: -2.25432
      thickness: 0.1
    voxel_size: 0.1
    plotting:
      obstacle_points:
        max_num: 10000
        alpha: 0.1

    # This file relates the graph waypoints to world coordinates.
    graph_waypoints_file: "src/assets/graphs/n=15/tunnels_3d.json"

    # From the paper, we provide these example waypoints
    # for a 2-agent system to explore the 3d chamber
    graph_waypoints:
      [
        # Agent 1
        [0, 9, 13, 9, 0, 2, 6, 5, 7, 8 ,7, 5, 6, 2],
        # Agent 2
        [0, 1, 10, 11, 10, 3, 4, 12, 4, 14, 5, 6, 2, 0]
      ]

  # 'combined' is the chamber + tunnels sections joined by new connector tunnels
  # (authored in cave-maps.blend, exported as combined.ply). Unlike the old
  # composite, this is a SINGLE physically-connected navigable volume: one flood
  # fill spans both sections, and line-of-sight / traversibility route through the
  # connectors -- so it is treated as a normal single-ply cave.
  combined:
    source: DARPA SubT Challenge Final Event (sections 5 + 6, joined)
    relative_path: "/src/assets/point_clouds/combined.ply"
    # Interior seed shared with chamber (inside the joined volume, free voxel).
    known_internal_xyz: [59.301, 105.96, 0.136567]
    slice_for_2d:
      z: -3.1
      thickness: 0.1
    voxel_size: 0.1
    plotting:
      obstacle_points:
        max_num: 30000
        alpha: 0.1
    # Relates graph waypoints to world coordinates (any generated size works).
    graph_waypoints_file: "src/assets/graphs/n=20/combined_3d.json"

  # The grapevine cave has been surveyed on multiple expeditions. Each survey is
  # kept as its own cave entry so the history is preserved. ALWAYS use the latest
  # (grapevine-exped-3); grapevine-exped-2 is archived for reference.

  # --- Archived: first survey (do not delete) --------------------------- #
  grapevine-exped-2:
    source: Stanford Expedition
    status: archived   # superseded by grapevine-exped-3; kept for history
    metadata:
      - key: Expedition number
        value: 2
      - key: Expedition date
        value: 24 May 2025
      - key: Survey team
        value:
          - Isaac R. Ward
          - Michelle Ho
          - Maximilian Adang
    # The original 30.4M-point ASCII cloud (892 MB), too heavy to voxelize on
    # modest machines -- this is why exped-3 (a light mesh) is used instead.
    relative_path: "/src/assets/point_clouds/grapevine-exped-2.ply"
    known_internal_xyz: [-0.672833, 0.089741, 1.85611]
    slice_for_2d:
      z: 1.94226
      thickness: 0.01
    voxel_size: 0.2
    plotting:
      obstacle_points:
        max_num: 20000
        alpha: 0.1

  # --- Active: latest survey (always use this one) ---------------------- #
  grapevine-exped-3:
    source: Stanford Expedition
    status: active
    metadata:
      - key: Expedition number
        value: 3
      - key: Expedition date
        value: 7 February 2026
      - key: Survey team
        value:
          - Isaac R. Ward
          - Maximilian Adang
          - Mahdi Al-Husseini
          - Vikas Patel
          - Mark Leone
    # Light expedition mesh (800K verts, 30 MB). Same coordinate frame as
    # exped-2, so known_internal_xyz / slice_z carry over.
    relative_path: "/src/assets/point_clouds/grapevine-exped-3.ply"
    known_internal_xyz: [-0.672833, 0.089741, 1.85611]
    slice_for_2d:
      z: 1.94226
      thickness: 0.01
    voxel_size: 0.2
    plotting:
      obstacle_points:
        max_num: 20000
        alpha: 0.1

# ----------------------------------------------------------------
# Relating to the underlying physical dynamics models
# ----------------------------------------------------------------
dynamics:

  dynamics_2d_linear:
    dt: 0.25
    # State is [x, y]
    state_dim: 2
    state_limits:
      - [null, null]
      - [null, null]
    # Action is [ux, uy]
    action_dim: 2
    action_limits:
      - [-2, 2]
      - [-2, 2]  
    position_dimensions: [0, 1]

  dynamics_3d_linear:
    dt: 0.1 # 0.25
    # State is [x, y, z]
    state_dim: 3
    state_limits:
      - [null, null]
      - [null, null]
      - [null, null]
    # Action is [ux, uy, uz]
    action_dim: 3
    action_limits:
      - [-1, 1]
      - [-1, 1]
      - [-1, 1]
    position_dimensions: [0, 1, 2]

  dynamics_3d:
    # Full 12D rigid-body quadrotor (RK4 sub-stepped). In the controller modes
    # the policy commands a setpoint and a cascaded controller inside the
    # dynamics computes rotor speeds every sub-step.
    dt: 0.1
    control_mode: velocity          # rotor_speeds | attitude | velocity
    integrator: rk4
    substeps: 10                    # 100 Hz inner loop
    # State: [x, y, z, yaw, pitch, roll, vx, vy, vz, p, q, r]
    state_dim: 12
    state_limits: [[null, null], [null, null], [null, null], [null, null], [null, null], [null, null],
                   [null, null], [null, null], [null, null], [null, null], [null, null], [null, null]]
    # Action (velocity mode): [vx, vy, vz (m/s, world), yaw_rate (rad/s)]
    action_dim: 4
    action_limits:
      - [-2.0, 2.0]
      - [-2.0, 2.0]
      - [-1.0, 1.0]
      - [-0.5, 0.5]
    # attitude mode instead: [[-4,4],[-0.5,0.5],[-0.5,0.5],[-0.5,0.5]]
    # rotor_speeds mode instead: [[100,1500]] x4 (rad/s)
    position_dimensions: [0, 1, 2]
    # ~1 kg quad, 0.25 m motor-to-motor, thrust-to-weight 2 (see dynamics_3d.py)
    physical_parameters:
      mass: 1.0
      diameter: 0.25
      Ix: 3.2e-3
      Iy: 3.2e-3
      Iz: 5.5e-3
      g: 9.81
      thrust_coef: 2.18e-6
      drag_yaw_coef: 4.4e-8
      drag_force_coef: 0.3
      rotor_speed_min: 100.0
      rotor_speed_max: 1500.0
    controller_parameters:
      k_rate_rp: 40.0
      k_rate_yaw: 10.0
      k_att: 10.0
      k_vel_xy: 2.5
      k_vel_z: 3.0
      max_tilt_deg: 35.0
      max_accel_up: 5.0
      max_accel_down: 5.0
