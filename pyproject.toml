[project]
name = "prospector"
version = "0.1.0"
description = "Underground cave simulation for single-agent and multi-agent robotic systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
  "hydra-core>=1.3",
  "omegaconf>=2.3.0",
  "open3d>=0.18.0",
  "moviepy>=1.0.3",
  "wandb>=0.17.0",
  "jax>=0.8.1",
]

[tool.uv]
package = true

[tool.setuptools]
packages = { find = { where = ["src"] } }
